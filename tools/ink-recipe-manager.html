<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Recipe Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #e9e6e0; color: #26231f; font-size: 14px; overflow: hidden; }
  #app { display: flex; height: 100vh; }
  /* 左侧导航 —— 软件式 */
  #side { width: 208px; background: #26231f; color: #cfccc4; display: flex; flex-direction: column; flex-shrink: 0; }
  #side .brand { padding: 16px 16px 12px; border-bottom: 1px solid #3a362f; }
  #side .brand b { color: #faf8f4; font-size: .98rem; display: block; }
  #side .brand span { font-size: .68rem; color: #8a857c; }
  #side nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  #side nav button { text-align: left; font-size: .88rem; padding: 10px 12px; border: none; background: transparent; color: #cfccc4; border-radius: 5px; cursor: pointer; }
  #side nav button:hover { background: #332f29; }
  #side nav button.on { background: #c8452c; color: #fff; font-weight: 600; }
  #side .backup { margin-top: auto; padding: 12px; border-top: 1px solid #3a362f; }
  #side .backup .t { font-size: .72rem; color: #8a857c; margin-bottom: 6px; }
  #side .backup button { width: 100%; font-size: .78rem; padding: 7px 0; margin-bottom: 6px; border: 1px solid #57524a; background: transparent; color: #cfccc4; border-radius: 4px; cursor: pointer; }
  #side .backup button:hover { background: #332f29; }
  /* 主区 */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { background: #fff; border-bottom: 1px solid #d8d2c8; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
  #toolbar .sec-name { font-size: .95rem; font-weight: 700; }
  #toolbar .badge { font-size: .68rem; background: #fdf3e3; border: 1px solid #e8d5ae; color: #8a6d2c; padding: 2px 8px; border-radius: 3px; }
  main { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .panel { background: #fff; border: 1px solid #d8d2c8; border-radius: 6px; padding: 14px 16px; }
  #statusbar { background: #f5f2ec; border-top: 1px solid #d8d2c8; padding: 6px 18px; font-size: .74rem; color: #6b665e; }
  table { width: 100%; border-collapse: collapse; font-size: .83rem; }
  th, td { border: 1px solid #e5e0d7; padding: 5px 7px; text-align: left; }
  th { background: #f5f2ec; font-weight: 600; white-space: nowrap; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #faf6ee; }
  .btn { font-size: .82rem; padding: 6px 12px; border: 1px solid #26231f; background: #26231f; color: #faf8f4; border-radius: 4px; cursor: pointer; }
  .btn.ghost { background: #fff; color: #26231f; border-color: #b8b4ad; }
  .btn.danger { background: #fff; color: #c8452c; border-color: #c8452c; }
  .btn.sm { font-size: .74rem; padding: 3px 8px; }
  input, select, textarea { font-size: .84rem; padding: 5px 7px; border: 1px solid #c9c3b8; border-radius: 4px; background: #fff; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 1.5px solid #c8452c; }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: .74rem; color: #8a857c; }
  .grid { display: grid; gap: 10px; }
  .muted { color: #8a857c; font-size: .78rem; }
  .tag { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 3px; background: #eef2f7; border: 1px solid #b9c6d8; }
  .tag.io { background: #e8f4e5; border-color: #9fc794; }
  .tag.nio { background: #fbeaea; border-color: #e0a9a0; }
  .tag.bp { background: #fdf3e3; border-color: #e8d5ae; }
  .mask { position: fixed; inset: 0; background: rgba(30,27,23,.45); display: none; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 30px 12px; }
  .mask.show { display: flex; }
  .modal { background: #fff; border-radius: 8px; padding: 18px; width: 100%; max-width: 760px; }
  .modal h3 { font-size: 1rem; margin-bottom: 12px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .out-range { color: #c8452c; font-weight: 700; }
  .hint-bar { background: #fdf3e3; border: 1px solid #e8d5ae; border-radius: 5px; padding: 8px 12px; font-size: .8rem; margin-bottom: 12px; }
  .rowflex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sec-title { font-size: .92rem; font-weight: 700; margin: 18px 0 8px; padding-left: 8px; border-left: 3px solid #c8452c; }

  /* 层照片缩略图 */
  .thumb { width: 52px; height: 38px; object-fit: cover; border: 1px solid #c9c3b8; border-radius: 3px; cursor: zoom-in; display: block; }
  .thumb-empty { width: 52px; height: 38px; border: 1.5px dashed #c9c3b8; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #b8b4ad; cursor: pointer; background: #faf8f4; }
  .thumb-empty:hover { border-color: #c8452c; color: #c8452c; }
  .photo-view { text-align: center; }
  .photo-view img { max-width: 100%; max-height: 70vh; border: 1px solid #d8d2c8; }
  /* 打印版式：屏幕隐藏，打印时独占 */
  #print-sheet { display: none; }
  @media print {
    body { overflow: visible; background: #fff; }
    #app, .mask { display: none !important; }
    #print-sheet { display: block; font-size: 12px; color: #000; }
    #print-sheet .ps-head { border-bottom: 2.5px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
    #print-sheet h1 { font-size: 18px; }
    #print-sheet .ps-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 6px 0 10px; font-size: 12px; }
    #print-sheet table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    #print-sheet th, #print-sheet td { border: 1px solid #000; padding: 4px 6px; font-size: 11.5px; }
    #print-sheet th { background: #eee; }
    #print-sheet .ps-layer { border: 1.5px solid #000; margin-bottom: 12px; page-break-inside: avoid; }
    #print-sheet .ps-layer-title { background: #eee; font-weight: 700; padding: 4px 8px; font-size: 13px; border-bottom: 1px solid #000; }
    #print-sheet .ps-layer-body { display: flex; gap: 10px; padding: 8px; }
    #print-sheet .ps-photo { width: 130px; flex-shrink: 0; }
    #print-sheet .ps-photo img { width: 100%; border: 1px solid #999; }
    #print-sheet .ps-photo .nophoto { border: 1px dashed #999; height: 90px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 11px; }
    #print-sheet .ps-fields { flex: 1; }
    #print-sheet .ps-sign { margin-top: 14px; display: flex; gap: 40px; font-size: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>Ink Recipe Manager</b><span>DEMO v0.4 · Standalone</span></div>
    <nav>
      <button data-tab="projects" class="on">📋 Projects</button>
      <button data-tab="inks">🎨 Ink Library</button>
      <button data-tab="components">🧪 Components</button>
      <button data-tab="calc">⚖ Weighing Calc</button>
    </nav>
    <div class="backup">
      <div class="t">Data backup (monthly recommended)</div>
      <button id="btn-export">⬇ Export backup</button>
      <button id="btn-import">⬆ Restore from backup</button>
      <input type="file" id="file-import" accept=".json" style="display:none">
      <div class="t" style="margin-top:8px;">Tip: in Chrome/Edge use menu → "Install app" to pin it to your desktop like a regular program.</div>
    </div>
  </aside>
  <div id="main">
    <div id="toolbar">
      <span class="sec-name" id="sec-name">Projects</span>
      <span class="badge">Local only · No cloud</span>
    </div>
    <main>
      <div class="panel" id="panel-projects"></div>
      <div class="panel" id="panel-inks" style="display:none"></div>
      <div class="panel" id="panel-components" style="display:none"></div>
      <div class="panel" id="panel-calc" style="display:none"></div>
    </main>
    <div id="statusbar">Loading…</div>
  </div>
</div>
<div id="print-sheet"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
(function(){
'use strict';
/* ============ 数据层 ============ */
var DB = null, _db = null, LAST_SAVE = null;

function seed(){
  return {
    components: [
      {id:'c1', no:'DEMO-971', name:'Demo Black 971', type:'Base Ink', note:''},
      {id:'c2', no:'DEMO-675', name:'Demo White 675', type:'Base Ink', note:''},
      {id:'c3', no:'DEMO-277', name:'Demo Red-Yellow 277', type:'Base Ink', note:''},
      {id:'c4', no:'DEMO-001', name:'Demo Clear 001', type:'Base Ink', note:''},
      {id:'c5', no:'DIL-003', name:'Demo Thinner F-003', type:'Thinner', note:'Reduce in summer'},
      {id:'c6', no:'CLN-200', name:'Demo Hardener 200', type:'Hardener', note:'Ratio affects adhesion'},
      {id:'c7', no:'HRD-H1', name:'Demo Catalyst H1', type:'Hardener', note:''}
    ],
    inks: [
      {id:'i1', name:'Demo Dark Gray', system:'Solvent-based', note:'Base color for door trim',
       parts:[{cid:'c1',amount:8,unit:'g'},{cid:'c2',amount:5,unit:'g'},{cid:'c3',amount:4,unit:'g'},{cid:'c5',amount:10,unit:'%'},{cid:'c6',amount:10,unit:'%'}]},
      {id:'i2', name:'Demo Matte Silver', system:'Solvent-based', note:'',
       parts:[{cid:'c4',amount:100,unit:'g'},{cid:'c1',amount:9,unit:'g'},{cid:'c5',amount:12,unit:'%'},{cid:'c7',amount:7,unit:'%'},{cid:'c6',amount:10,unit:'%'}]},
      {id:'i3', name:'Demo Solid Black', system:'Solvent-based', note:'For opacity layers',
       parts:[{cid:'c1',amount:100,unit:'g'},{cid:'c5',amount:12,unit:'%'},{cid:'c7',amount:7,unit:'%'}]}
    ],
    projects: [{
      id:'p1', code:'DEMO-2024-001', product:'Door Trim Strip (sample data)', material:'PC (demo grade)',
      thickness:'0.75', size:'900×660', machine:'Demo Press A1', qty:100,
      status:'io', date:'2024-06-01', owner:'Demo Operator',
      pretreat:'UV pretreatment 800 mJ/cm² (PC sheet)', posttreat:'Post-cure 80°C/30 min; wait 24 h before laminating',
      layers:[
        {seq:1, side:'BP', type:'Design', film:'DEMO-F001', mesh:'120-34', inkId:'i1', viscLo:7.0, viscHi:8.0, viscAct:7.4, ir:'70/80', oven:'90/100', uv:'', charge:120, note:''},
        {seq:2, side:'BP', type:'Design', film:'DEMO-F002', mesh:'90-40', inkId:'i3', viscLo:7.0, viscHi:8.0, viscAct:8.6, ir:'70/80', oven:'90/100', uv:'', charge:150, note:'Second pass for opacity'},
        {seq:3, side:'BP', type:'Design', film:'DEMO-F003', mesh:'90-40', inkId:'i3', viscLo:7.0, viscHi:8.0, viscAct:7.8, ir:'70/80', oven:'90/100', uv:'', charge:150, note:''},
        {seq:4, side:'BP', type:'Solid', film:'DEMO-F004', mesh:'120-34', inkId:'i2', viscLo:4.0, viscHi:5.0, viscAct:4.5, ir:'70/80', oven:'90/100', uv:'', charge:180, note:''},
        {seq:5, side:'FP', type:'Design', film:'DEMO-F005', mesh:'90-40', inkId:'i2', viscLo:0.2, viscHi:0.3, viscAct:0.25, ir:'', oven:'80/80', uv:'', charge:100, note:'Front effect layer'}
      ]
    }]
  };
}

function save(){
  LAST_SAVE = new Date();
  if (_db) { try { _db.transaction('kv','readwrite').objectStore('kv').put(DB,'db'); } catch(e){} }
  try { localStorage.setItem('inkRecipeDB_en_v1', JSON.stringify(DB)); } catch(e){}
  updateStatus();
}
function updateStatus(){
  var el = document.getElementById('statusbar'); if (!el || !DB) return;
  function txt(used, quota){
    return '<b>Projects ' + DB.projects.length + '</b> · Inks ' + DB.inks.length + ' · Components ' + DB.components.length
      + '　|　Storage ' + used + ' MB / ~' + quota + ' MB'
      + (LAST_SAVE ? '　|　Last saved ' + LAST_SAVE.toLocaleTimeString() : '')
      + '　|　Stored locally (IndexedDB) — never leaves this computer';
  }
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function(est){
      el.innerHTML = txt((est.usage/1048576).toFixed(2), Math.round((est.quota||0)/1048576));
    });
  } else {
    el.innerHTML = txt((JSON.stringify(DB).length/1048576).toFixed(2), '?');
  }
}
function startApp(){
  // 优先 IndexedDB（大容量）；失败退回 localStorage；都没有则用示例数据
  function afterLoad(){
    if (!DB) {
      try { var s = localStorage.getItem('inkRecipeDB_en_v1'); if (s) DB = JSON.parse(s); } catch(e){}
    }
    if (!DB) DB = seed();
    save(); render();
  }
  if (!window.indexedDB) return afterLoad();
  try {
    var req = indexedDB.open('inkRecipeDB_en', 1);
    req.onupgradeneeded = function(e){ e.target.result.createObjectStore('kv'); };
    req.onsuccess = function(e){
      _db = e.target.result;
      try {
        var r = _db.transaction('kv','readonly').objectStore('kv').get('db');
        r.onsuccess = function(){ DB = r.result || null; afterLoad(); };
        r.onerror = function(){ afterLoad(); };
      } catch(err){ afterLoad(); }
    };
    req.onerror = function(){ afterLoad(); };
  } catch(err){ afterLoad(); }
}
// 请求持久化存储权限，防浏览器自动清除
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function comp(id){ return DB.components.find(function(c){return c.id===id;}); }
function ink(id){ return DB.inks.find(function(i){return i.id===id;}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

/* ============ 弹窗 ============ */
var mask = document.getElementById('mask'), modal = document.getElementById('modal');
function openModal(html){ modal.innerHTML = html; mask.classList.add('show'); }
function closeModal(){ mask.classList.remove('show'); modal.innerHTML=''; }
mask.addEventListener('click', function(e){ if(e.target===mask) closeModal(); });

/* ============ 页签 ============ */
var tab = 'projects';
document.querySelectorAll('[data-tab]').forEach(function(b){
  b.addEventListener('click', function(){
    tab = b.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(function(x){ x.classList.toggle('on', x===b); });
    var names = {projects:'Projects', inks:'Ink Library', components:'Components', calc:'Weighing Calc'};
    document.getElementById('sec-name').textContent = names[tab];
    ['projects','inks','components','calc'].forEach(function(t){
      document.getElementById('panel-'+t).style.display = (t===tab)?'':'none';
    });
    render();
  });
});

/* ============ 渲染 ============ */
function render(){
  updateStatus();
  if (tab==='projects') renderProjects();
  else if (tab==='inks') renderInks();
  else if (tab==='components') renderComponents();
  else if (tab==='calc') renderCalc();
}

/* ---------- 项目列表 ---------- */
var curProject = null;
function renderProjects(){
  var el = document.getElementById('panel-projects');
  if (curProject) { renderProjectDetail(curProject); return; }
  var h = '<div class="rowflex" style="justify-content:space-between;margin-bottom:10px;">'
    + '<span class="muted">'+DB.projects.length+' project(s) · click a row to open its print layers</span>'
    + '<button class="btn" id="p-add">+ New Project</button></div>'
    + '<table><tr><th>Code</th><th>Product</th><th>Substrate</th><th>Press</th><th>Layers</th><th>Status</th><th>Date</th><th>Owner</th><th></th></tr>';
  DB.projects.forEach(function(p){
    var st = p.status==='io' ? '<span class="tag io">Released</span>' : (p.status==='nio' ? '<span class="tag nio">Rejected</span>' : '<span class="tag">In Trial</span>');
    h += '<tr class="clickable" data-p="'+p.id+'"><td><b>'+esc(p.code)+'</b></td><td>'+esc(p.product)+'</td><td>'+esc(p.material)+' '+esc(p.thickness)+'mm</td><td>'+esc(p.machine)+'</td><td>'+p.layers.length+'</td><td>'+st+'</td><td>'+esc(p.date)+'</td><td>'+esc(p.owner)+'</td>'
      + '<td><button class="btn sm danger" data-del="'+p.id+'">Del</button></td></tr>';
  });
  h += '</table>';
  el.innerHTML = h;
  el.querySelector('#p-add').addEventListener('click', function(){
    DB.projects.push({id:uid('p'), code:'NEW-'+new Date().toISOString().slice(0,10), product:'', material:'', thickness:'', size:'', machine:'', qty:'', status:'trial', date:new Date().toISOString().slice(0,10), owner:'', pretreat:'', posttreat:'', layers:[]});
    save(); renderProjects();
  });
  el.querySelectorAll('tr.clickable').forEach(function(tr){
    tr.addEventListener('click', function(e){
      if (e.target.dataset.del) return;
      curProject = tr.dataset.p; renderProjects();
    });
  });
  el.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      if (!confirm('Delete this project and all its layers?')) return;
      DB.projects = DB.projects.filter(function(p){return p.id!==b.dataset.del;});
      save(); renderProjects();
    });
  });
}

/* ---------- 项目详情 ---------- */
function renderProjectDetail(pid){
  var p = DB.projects.find(function(x){return x.id===pid;});
  if (!p) { curProject=null; renderProjects(); return; }
  var el = document.getElementById('panel-projects');
  function fld(label, key, type, w){
    return '<label class="f" style="'+(w?('grid-column:span '+w+';'):'')+'">'+label
      + '<input data-k="'+key+'" type="'+(type||'text')+'" value="'+esc(p[key])+'"></label>';
  }
  var h = '<div class="rowflex" style="margin-bottom:10px;">'
    + '<button class="btn ghost sm" id="p-back">← Back to list</button><b style="font-size:1rem;">'+esc(p.code)+'</b>'
    + '<span style="flex:1"></span>'
    + '<button class="btn ghost sm" id="p-dup">⧉ Duplicate</button> '
    + '<button class="btn sm" id="p-print">🖨 Print Mix Sheet</button></div>'
    + '<div class="grid" style="grid-template-columns:repeat(4,1fr);">'
    + fld('Code','code') + fld('Product / Part','product') + fld('Substrate','material') + fld('Thickness mm','thickness')
    + fld('Sheet size','size') + fld('Press','machine') + fld('Qty','qty','number') + fld('Date','date','date')
    + fld('Owner','owner')
    + '<label class="f">Status<select data-k="status">'
    +   ['trial|In Trial','io|Released','nio|Rejected'].map(function(o){ var v=o.split('|'); return '<option value="'+v[0]+'"'+(p.status===v[0]?' selected':'')+'>'+v[1]+'</option>';}).join('')
    + '</select></label>'
    + '</div>'
    + '<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px;">'
    + '<label class="f">Pre-treatment<textarea data-k="pretreat" rows="2">'+esc(p.pretreat)+'</textarea></label>'
    + '<label class="f">Post-treatment / Lamination<textarea data-k="posttreat" rows="2">'+esc(p.posttreat)+'</textarea></label>'
    + '</div>'
    + '<div class="sec-title">Print Layers (in print order — click a row to edit)</div>'
    + '<table><tr><th>#</th><th>Side</th><th>Screen Photo</th><th>Type</th><th>Film No.</th><th>Mesh</th><th>Ink</th><th>Visc. Target (mPa·s)</th><th>Actual</th><th>IR%</th><th>Oven °C</th><th>Charge g</th><th>Note</th><th></th></tr>';
  var layers = p.layers.slice().sort(function(a,b){return a.seq-b.seq;});
  layers.forEach(function(L, idx){
    var ik = ink(L.inkId);
    var out = (L.viscAct!==''&&L.viscAct!=null&&L.viscLo!==''&&L.viscHi!==''&&(+L.viscAct<+L.viscLo||+L.viscAct>+L.viscHi));
    h += '<tr class="clickable" data-l="'+idx+'">'
      + '<td><b>'+L.seq+'</b></td>'
      + '<td>'+(L.side==='BP'?'<span class="tag bp">BP</span>':'<span class="tag">FP</span>')+'</td>'
      + '<td>'+(L.photo
          ? '<img class="thumb" data-photo="'+idx+'" src="'+L.photo+'" alt="screen">'
          : '<span class="thumb-empty" data-photo="'+idx+'" title="Click to add a screen photo">📷</span>')+'</td>'
      + '<td>'+esc(L.type)+'</td><td>'+esc(L.film)+'</td><td>'+esc(L.mesh)+'</td>'
      + '<td>'+(ik?esc(ik.name):'<span class="muted">—</span>')+'</td>'
      + '<td>'+L.viscLo+' ~ '+L.viscHi+'</td>'
      + '<td class="'+(out?'out-range':'')+'">'+(L.viscAct===''?'—':L.viscAct)+(out?' ⚠':'')+'</td>'
      + '<td>'+esc(L.ir)+'</td><td>'+esc(L.oven)+'</td><td>'+esc(L.charge)+'</td><td>'+esc(L.note)+'</td>'
      + '<td style="white-space:nowrap;">'
      + (idx>0?'<button class="btn sm ghost" data-up="'+idx+'">↑</button>':'')
      + ' <button class="btn sm danger" data-ldel="'+idx+'">Del</button></td></tr>';
  });
  h += '</table><div style="margin-top:8px;"><button class="btn" id="l-add">+ Add Layer</button></div>'
    + '<p class="muted" style="margin-top:10px;">BP = back-side printing, FP = front-side printing. Actual viscosity outside the target range is flagged red. Mixed inks are maintained in the Ink Library.</p>';
  el.innerHTML = h;

  el.querySelectorAll('[data-k]').forEach(function(inp){
    inp.addEventListener('change', function(){ p[inp.dataset.k] = inp.value; save(); });
  });
  el.querySelector('#p-back').addEventListener('click', function(){ curProject=null; renderProjects(); });
  el.querySelector('#p-dup').addEventListener('click', function(){
    var copy = JSON.parse(JSON.stringify(p));
    copy.id = uid('p'); copy.code = p.code + '-COPY'; copy.status = 'trial'; copy.date = new Date().toISOString().slice(0,10);
    DB.projects.push(copy); save(); curProject = copy.id; renderProjects();
  });
  el.querySelector('#p-print').addEventListener('click', function(){ printSheet(p); });
  el.querySelectorAll('[data-photo]').forEach(function(t){
    t.addEventListener('click', function(e){
      e.stopPropagation();
      var L = layers[+t.dataset.photo];
      if (L.photo) {
        openModal('<h3>Layer '+L.seq+' · Screen Photo</h3><div class="photo-view"><img src="'+L.photo+'"></div>'
          + '<div class="foot"><button class="btn danger" id="ph-del">Delete photo</button> <button class="btn ghost" id="m-close">Close</button></div>');
        modal.querySelector('#ph-del').addEventListener('click', function(){ if(confirm('Delete this layer photo?')){ L.photo=''; save(); closeModal(); renderProjectDetail(p.id); } });
        modal.querySelector('#m-close').addEventListener('click', closeModal);
      } else {
        pickPhoto(function(dataUrl){ L.photo = dataUrl; save(); renderProjectDetail(p.id); });
      }
    });
  });
  el.querySelector('#l-add').addEventListener('click', function(){
    var mx = p.layers.reduce(function(m,L){return Math.max(m,L.seq);},0);
    p.layers.push({seq:mx+1, side:'BP', type:'Design', film:'', mesh:'', inkId:'', viscLo:'', viscHi:'', viscAct:'', ir:'', oven:'', uv:'', charge:'', note:''});
    save(); renderProjectDetail(pid);
  });
  el.querySelectorAll('[data-up]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var i = +b.dataset.up;
      var a = layers[i-1], bb = layers[i], t = a.seq; a.seq = bb.seq; bb.seq = t;
      save(); renderProjectDetail(pid);
    });
  });
  el.querySelectorAll('[data-ldel]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      if(!confirm('Delete this layer?')) return;
      var victim = layers[+b.dataset.ldel];
      p.layers = p.layers.filter(function(L){return L!==victim;});
      save(); renderProjectDetail(pid);
    });
  });
  el.querySelectorAll('tr.clickable').forEach(function(tr){
    tr.addEventListener('click', function(e){
      if (e.target.dataset.up!==undefined || e.target.dataset.ldel!==undefined || e.target.tagName==='BUTTON') return;
      openLayerModal(p, layers[+tr.dataset.l]);
    });
  });
}


/* 照片选择+压缩：长边 1200px，JPEG 0.8，约 100–200KB/张 */
function pickPhoto(cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = function(){
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var MAX = 1200, w = img.width, h = img.height;
        if (Math.max(w,h) > MAX) { var k = MAX/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

    return '<label class="f">'+label+'<input data-lk="'+key+'" type="'+(type||'text')+'" value="'+esc(L[key])+'"></label>';

    + mf('IR drying %','ir') + mf('Oven °C','oven') + mf('UV mJ/cm²','uv')

/* ---------- 混墨库 ---------- */
function renderInks(){

  var h = '<div class="rowflex" style="justify-content:space-between;margin-bottom:10px;">'
    + '<span class="muted">Proven colors live here and are referenced by projects · '+DB.inks.length+' total</span>'
    + '<button class="btn" id="i-add">+ New Mixed Ink</button></div>';
  DB.inks.forEach(function(ik){
    var users = 0;
    DB.projects.forEach(function(p){ p.layers.forEach(function(L){ if(L.inkId===ik.id) users++; }); });
    h += '<div style="border:1px solid #e0dbd2;border-radius:6px;padding:10px 12px;margin-bottom:8px;">'
      + '<div class="rowflex"><b>'+esc(ik.name)+'</b><span class="tag">'+esc(ik.system)+'</span>'
      + '<span class="muted">Used by '+users+' layer(s)</span><span class="spacer" style="flex:1"></span>'
      + '<button class="btn sm" data-iedit="'+ik.id+'">Edit Formula</button> '
      + '<button class="btn sm danger" data-idel="'+ik.id+'">Del</button></div>'
      + '<div style="margin-top:6px;font-size:.84rem;">'
      + ik.parts.map(function(pt){ var c = comp(pt.cid); return '<span class="tag" style="margin:2px 3px 2px 0;">'+esc(c?c.name:'?')+' <b>'+pt.amount+pt.unit+'</b></span>'; }).join(' ')
      + '</div>'
      + (ik.note?'<div class="muted" style="margin-top:4px;">Note: '+esc(ik.note)+'</div>':'')
      + '</div>';
  });
  el.innerHTML = h;
  el.querySelector('#i-add').addEventListener('click', function(){
    DB.inks.push({id:uid('i'), name:'New Mixed Ink', system:'Solvent-based', note:'', parts:[]});
    save(); renderInks();
  });
  el.querySelectorAll('[data-idel]').forEach(function(b){
    b.addEventListener('click', function(){
      var used = 0;
      DB.projects.forEach(function(p){ p.layers.forEach(function(L){ if(L.inkId===b.dataset.idel) used++; }); });
      if (used>0) { alert('This ink is used by '+used+' layer(s) and cannot be deleted.'); return; }
      if (!confirm('Delete this mixed ink?')) return;
      DB.inks = DB.inks.filter(function(i){return i.id!==b.dataset.idel;});
      save(); renderInks();
    });
  });
  el.querySelectorAll('[data-iedit]').forEach(function(b){
    b.addEventListener('click', function(){ openInkModal(ink(b.dataset.iedit)); });
  });
}
function openInkModal(ik){
  function partsRows(){
    return ik.parts.map(function(pt, idx){
      var cOpts = DB.components.map(function(c){
        return '<option value="'+c.id+'"'+(pt.cid===c.id?' selected':'')+'>'+esc(c.no)+' · '+esc(c.name)+'</option>';
      }).join('');
      return '<tr><td><select data-pcid="'+idx+'">'+cOpts+'</select></td>'
        + '<td><input data-pamt="'+idx+'" type="number" step="any" value="'+pt.amount+'" style="width:6rem;"></td>'
        + '<td><select data-punit="'+idx+'"><option'+(pt.unit==='g'?' selected':'')+'>g</option><option'+(pt.unit==='%'?' selected':'')+'>%</option><option'+(pt.unit==='parts'?' selected':'')+'>parts</option></select></td>'
        + '<td><button class="btn sm danger" data-pdel="'+idx+'">Del</button></td></tr>';
    }).join('');
  }
  openModal(
    '<h3>Mixed Ink Formula</h3>'
    + '<div class="grid" style="grid-template-columns:2fr 1fr;">'
    + '<label class="f">Color name<input id="ik-name" value="'+esc(ik.name)+'"></label>'
    + '<label class="f">Ink system<input id="ik-system" list="syslist" value="'+esc(ik.system)+'"><datalist id="syslist"><option>Solvent-based</option><option>UV</option><option>Water-based</option><option>Plastisol</option></datalist></label>'
    + '</div>'
    + '<div class="sec-title">Components (from the Components library)</div>'
    + '<table><tr><th>Component</th><th>Amount</th><th>Unit</th><th></th></tr><tbody id="ik-parts">'+partsRows()+'</tbody></table>'
    + '<div style="margin-top:8px;"><button class="btn ghost sm" id="ik-addpart">+ Add component</button></div>'
    + '<label class="f" style="margin-top:10px;">Note<textarea id="ik-note" rows="2">'+esc(ik.note)+'</textarea></label>'
    + '<div class="foot"><button class="btn ghost" id="m-close">Close</button></div>'
  );
  function bind(){
    modal.querySelector('#ik-name').addEventListener('change', function(){ ik.name=this.value; save(); });
    modal.querySelector('#ik-system').addEventListener('change', function(){ ik.system=this.value; save(); });
    modal.querySelector('#ik-note').addEventListener('change', function(){ ik.note=this.value; save(); });
    modal.querySelectorAll('[data-pcid]').forEach(function(s){ s.addEventListener('change', function(){ ik.parts[+s.dataset.pcid].cid = s.value; save(); }); });
    modal.querySelectorAll('[data-pamt]').forEach(function(s){ s.addEventListener('change', function(){ ik.parts[+s.dataset.pamt].amount = parseFloat(s.value)||0; save(); }); });
    modal.querySelectorAll('[data-punit]').forEach(function(s){ s.addEventListener('change', function(){ ik.parts[+s.dataset.punit].unit = s.value; save(); }); });
    modal.querySelectorAll('[data-pdel]').forEach(function(s){ s.addEventListener('click', function(){ ik.parts.splice(+s.dataset.pdel,1); save(); openInkModal(ik); }); });
    modal.querySelector('#ik-addpart').addEventListener('click', function(){
      ik.parts.push({cid: DB.components[0]?DB.components[0].id:'', amount:0, unit:'g'});
      save(); openInkModal(ik);
    });
    modal.querySelector('#m-close').addEventListener('click', function(){ closeModal(); renderInks(); });
  }
  bind();
}

    + '<button class="btn" id="c-add">+ New Component</button></div>'

    h += '<tr><td><b>'+esc(c.no)+'</b></td><td>'+esc(c.name)+'</td><td><span class="tag">'+esc(c.type)+'</span></td><td>'+esc(c.note)+'</td>'

  el.querySelectorAll('[data-cedit]').forEach(function(b){

        + '<label class="f">Name<input id="c-name" value="'+esc(c.name)+'"></label>'
        + '<label class="f">Type<select id="c-type">'+types.map(function(t){return '<option'+(c.type===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></label>'
        + '<label class="f">Note<input id="c-note" value="'+esc(c.note)+'"></label></div>'

      modal.querySelector('#c-no').addEventListener('change', function(){ c.no=this.value; save(); });
      modal.querySelector('#c-name').addEventListener('change', function(){ c.name=this.value; save(); });
      modal.querySelector('#c-type').addEventListener('change', function(){ c.type=this.value; save(); });

/* ---------- 称量计算器 ---------- */
function renderCalc(){
  var el = document.getElementById('panel-calc');
  var opts = DB.inks.map(function(i){ return '<option value="'+i.id+'">'+esc(i.name)+'</option>'; }).join('');
  el.innerHTML = '<div class="rowflex">'
    + '<label class="f" style="min-width:220px;">Mixed ink<select id="calc-ink">'+opts+'</select></label>'
    + '<label class="f">Total to mix, g<input id="calc-total" type="number" value="500" style="width:8rem;"></label>'
    + '<button class="btn" id="calc-go">Calculate</button></div>'
    + '<div id="calc-out" style="margin-top:14px;"></div>'
    + '<p class="muted" style="margin-top:12px;">Rule: parts in g are scaled so they sum to the target total; parts in % are computed as target total × %.</p>';
  el.querySelector('#calc-go').addEventListener('click', function(){
    var ik = ink(el.querySelector('#calc-ink').value);
    var total = parseFloat(el.querySelector('#calc-total').value)||0;
    var out = el.querySelector('#calc-out');
    if (!ik) { out.innerHTML = ''; return; }
    var gParts = ik.parts.filter(function(p){return p.unit!=='%';});
    var gSum = gParts.reduce(function(s,p){return s+(+p.amount||0);},0);
    var rows = '', scale = gSum>0 ? total/gSum : 0;
    ik.parts.forEach(function(pt){
      var c = comp(pt.cid);
      var w = pt.unit==='%' ? total*(+pt.amount||0)/100 : (+pt.amount||0)*scale;
      rows += '<tr><td>'+esc(c?c.no:'')+'</td><td>'+esc(c?c.name:'?')+'</td><td>'+pt.amount+' '+pt.unit+'</td><td><b>'+w.toFixed(1)+' g</b></td></tr>';
    });
    out.innerHTML = '<table><tr><th>Item No.</th><th>Name</th><th>Formula</th><th>Weigh out</th></tr>'+rows
      + '<tr><td colspan="3" style="text-align:right;"><b>Total</b></td><td><b>'
      + ik.parts.reduce(function(s,pt){ return s + (pt.unit==='%' ? total*(+pt.amount||0)/100 : (+pt.amount||0)*scale); },0).toFixed(1)+' g</b></td></tr></table>';
  });
}


/* ---------- 打印调墨单 ---------- */
function printSheet(p){
  var layers = p.layers.slice().sort(function(a,b){return a.seq-b.seq;});
  // 先问每层调多少克
  var rows = layers.map(function(L, i){
    return '<tr><td>Layer '+L.seq+' ('+(L.side==='BP'?'back':'front')+')</td>'
      + '<td><input type="number" data-total="'+i+'" value="'+(L.charge||500)+'" style="width:6rem;"> g</td></tr>';
  }).join('');
  openModal('<h3>Print Mix Sheet · Batch size per layer</h3>'
    + '<table><tr><th>Layer</th><th>Batch size</th></tr>'+rows+'</table>'
    + '<p class="muted" style="margin-top:8px;">The sheet auto-computes the target weight of every component and leaves an "Actual" column for handwriting.</p>'
    + '<div class="foot"><button class="btn ghost" id="m-close">Cancel</button> <button class="btn" id="m-print">Generate &amp; Print</button></div>');
  modal.querySelector('#m-close').addEventListener('click', closeModal);
  modal.querySelector('#m-print').addEventListener('click', function(){
    var totals = [];
    modal.querySelectorAll('[data-total]').forEach(function(inp){ totals[+inp.dataset.total] = parseFloat(inp.value)||0; });
    closeModal();
    renderPrintSheet(p, layers, totals);
    window.print();
  });
}
function renderPrintSheet(p, layers, totals){

  var stTxt = {trial:'In Trial', io:'Released', nio:'Rejected'}[p.status] || p.status;
  var h = '<div class="ps-head"><h1>Ink Mixing Work Order</h1></div>'
    + '<div class="ps-meta">'
    + '<span><b>Code: </b>'+esc(p.code)+'</span><span><b>Product: </b>'+esc(p.product)+'</span>'
    + '<span><b>Substrate: </b>'+esc(p.material)+' '+esc(p.thickness)+'mm</span><span><b>Size: </b>'+esc(p.size)+'</span>'
    + '<span><b>Press: </b>'+esc(p.machine)+'</span><span><b>Qty: </b>'+esc(p.qty)+'</span>'
    + '<span><b>Status: </b>'+stTxt+'</span><span><b>Date: </b>'+esc(p.date)+'</span><span><b>Owner: </b>'+esc(p.owner)+'</span>'
    + '</div>';
  if (p.pretreat) h += '<div style="margin-bottom:6px;"><b>Pre-treatment: </b>'+esc(p.pretreat)+'</div>';
  layers.forEach(function(L){
    var ik = ink(L.inkId);
    h += '<div class="ps-layer">'
      + '<div class="ps-layer-title">Layer '+L.seq+' · '+(L.side==='BP'?'Back BP':'Front FP')+' · '+esc(L.type)
      + ' | Film '+esc(L.film)+' | Mesh '+esc(L.mesh)+' | Batch '+(totals[layers.indexOf(L)]||0)+' g</div>'
      + '<div class="ps-layer-body">'
      + '<div class="ps-photo">'+(L.photo?'<img src="'+L.photo+'">':'<div class="nophoto">No photo</div>')+'</div>'
      + '<div class="ps-fields">'
      + '<div style="margin-bottom:5px;"><b>Ink: </b>'+(ik?esc(ik.name)+'（'+esc(ik.system)+'）':'—')
      + '　<b>Viscosity: </b>'+(L.viscLo!==''?L.viscLo+' ~ '+L.viscHi+' mPa·s':'—')
      + '　<b>Charge: </b>'+(L.charge||'—')+' g</div>';
    if (ik && ik.parts.length) {
      var total = totals[layers.indexOf(L)] || 0;
      var gSum = ik.parts.filter(function(x){return x.unit!=='%';}).reduce(function(sum,x){return sum+(+x.amount||0);},0);
      var scale = gSum>0 ? total/gSum : 0;
      h += '<table><tr><th>Component</th><th>Ratio</th><th>Target (g)</th><th>Actual (g)</th></tr>';
      ik.parts.forEach(function(pt){
        var c = comp(pt.cid);
        var w = pt.unit==='%' ? total*(+pt.amount||0)/100 : (+pt.amount||0)*scale;
        h += '<tr><td>'+esc(c?c.no+' '+c.name:'?')+'</td><td>'+pt.amount+' '+pt.unit+'</td>'
          + '<td><b>'+w.toFixed(1)+'</b></td><td></td></tr>';
      });
      h += '</table>';
    }
    h += '<div style="margin-top:4px;"><b>Drying: </b>IR '+esc(L.ir||'—')+'%　Oven '+esc(L.oven||'—')+'°C'
      + (L.uv?'　UV '+esc(L.uv)+' mJ/cm²':'')
      + (L.note?'　<b>Note: </b>'+esc(L.note):'')+'</div>'
      + '</div></div></div>';
  });
  if (p.posttreat) h += '<div><b>Post-treatment: </b>'+esc(p.posttreat)+'</div>';
  h += '<div class="ps-sign"><span>Mixed by: ＿＿＿＿＿＿</span><span>Checked by: ＿＿＿＿＿＿</span><span>Press lead: ＿＿＿＿＿＿</span><span>Printed: '+new Date().toLocaleString()+'</span></div>';
  document.getElementById('print-sheet').innerHTML = h;
}

/* ---------- 导出 / 导入 ---------- */
document.getElementById('btn-export').addEventListener('click', function(){
  var blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ink-recipe-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
});
document.getElementById('btn-import').addEventListener('click', function(){
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      if (!d.components || !d.inks || !d.projects) throw new Error('bad');
      if (!confirm('Import will OVERWRITE all current data. Continue? (Export a backup first.)')) return;
      DB = d; save(); curProject=null; render();
      alert('Import complete.');
    } catch(err){ alert('Invalid file format. Import failed.'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* ---------- 启动 ---------- */
startApp();
